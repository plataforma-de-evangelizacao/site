name: Biblioteca e GitHub Pages
run-name: "Biblioteca · ${{ inputs.admin_request || github.run_number }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modo:
        description: 'Publicar a plataforma'
        type: choice
        options: [publicar-site]
        default: publicar-site
      admin_request:
        description: 'Identificador da solicitação administrativa (preenchido pelo painel)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: plataforma-pages-biblioteca
  cancel-in-progress: false
env:
  ADMIN_REQUEST: ${{ inputs.admin_request }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      publicar: ${{ steps.processar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar publicação
        id: processar
        run: |
          python scripts/publicar_site.py
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$GITHUB_SHA" || exit 1
          echo "publicar=true" >> "$GITHUB_OUTPUT"
      - name: Preparar Pages
        if: steps.processar.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1
      - name: Informar resultado do processamento ao painel
        if: always() && env.ADMIN_REQUEST != ''
        env:
          JOB_RESULT: ${{ job.status }}
          NEEDS_PUBLISH: ${{ steps.processar.outputs.publicar }}
        run: python scripts/admin/report.py --processing-finished
  publicar:
    if: needs.processar.outputs.publicar == 'true'
    needs: processar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Informar publicação ao painel
        if: always() && env.ADMIN_REQUEST != ''
        env:
          JOB_RESULT: ${{ job.status }}
        run: python scripts/admin/report.py --publication-finished
