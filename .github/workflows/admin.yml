name: Painel administrativo
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plataforma-pages-biblioteca
  cancel-in-progress: false
jobs:
  gerir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar permissões e validações locais
        run: python -m unittest discover -s tests/admin -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar adaptador público
        run: node tests/admin/test_live_content.cjs
      - name: Instalar PostgreSQL local de teste
        run: npm ci --prefix tests/admin/sql-test --ignore-scripts --no-audit --no-fund
      - name: Testar funções e permissões no PostgreSQL
        run: node tests/admin/sql-test/test.cjs
      - name: Aplicar solicitações autorizadas
        id: admin
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/admin/sync.py
      - name: Atualizar dados do painel
        if: success() && (github.event_name == 'workflow_dispatch' || (steps.admin.outputs.applied != '' && steps.admin.outputs.applied != '0'))
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/admin/sync.py --export-only
      - name: Solicitar publicação das alterações
        if: steps.admin.outputs.applied != '' && steps.admin.outputs.applied != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run biblioteca.yml --ref main -f modo=publicar-site
