name: Validar interface administrativa
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes locais
        run: |
          node tests/admin/test_catalog_index.cjs
          node tests/admin/test_dispatch.cjs
          node tests/admin/test_display_ui.cjs
          node tests/admin/test_jobs.cjs
          node tests/admin/test_live_content.cjs
          node tests/admin/test_session.cjs
